<g class="m" font-size="34" font-weight="700" fill="#9fd0ff" fill-opacity="0.55">
<text class="f" x="90" y="150">&lt;/&gt;</text>
<text class="f d1" x="1040" y="110">&#123; &#125;</text>
<text class="f d2" x="170" y="250">$_</text>
