<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="ALGA - Fullstack Developer" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050d1c"/><stop offset="0.5" stop-color="#0d3566"/><stop offset="1" stop-color="#1f6fb5"/></linearGradient>
<linearGradient id="tx" x1="0" y1="0" x2="0" y2="1"><stop offset="0.15" stop-color="#ffffff"/><stop offset="1" stop-color="#6cb6ff"/></linearGradient>
<radialGradient id="gl" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#6cb6ff" stop-opacity="0.35"/><stop offset="1" stop-color="#6cb6ff" stop-opacity="0"/></radialGradient>
<pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9fd0ff" stroke-opacity="0.07"/></pattern>
<clipPath id="cp"><rect width="1200" height="320" rx="24"/></clipPath>
