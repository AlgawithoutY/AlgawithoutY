<style>
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes rl{0%{opacity:0;transform:translateY(8px)}5%{opacity:1;transform:translateY(0)}30%{opacity:1;transform:translateY(0)}35%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
@keyframes gw{0%,100%{opacity:.7}50%{opacity:1}}
.w1{animation:wv 14s linear infinite}.w2{animation:wv 22s linear infinite}
.f{animation:fl 5s ease-in-out infinite}.d1{animation-delay:-1.5s}.d2{animation-delay:-3s}
.t{animation:tw 3s ease-in-out infinite}.t1{animation-delay:-1s}.t2{animation-delay:-2s}
.r{opacity:0;animation:rl 9s infinite}.r2{animation-delay:3s}.r3{animation-delay:6s}
.g{animation:gw 4s ease-in-out infinite}
text{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
